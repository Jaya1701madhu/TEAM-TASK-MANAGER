<!doctype html>
<html>
  <head>
    <title>Create Project</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        background: #ffffff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        width: 350px;
        text-align: center;
      }

      h2 {
        margin-bottom: 20px;
        color: #333;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 14px;
        transition: 0.3s;
      }

      input:focus,
      textarea:focus {
        border-color: #4facfe;
        outline: none;
        box-shadow: 0 0 5px rgba(79, 172, 254, 0.5);
      }

      textarea {
        resize: none;
        height: 80px;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #4facfe;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #00c6ff;
      }

      a {
        display: inline-block;
        margin-top: 15px;
        text-decoration: none;
        color: #4facfe;
        font-weight: bold;
        transition: 0.3s;
      }

      a:hover {
        color: #0072ff;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Create Project</h2>

      <form method="POST">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Project Name" />
        <textarea name="description" placeholder="Description"></textarea>
        <button type="submit">Create</button>
      </form>

      <a href="/api/dashboard/">Go to Dashboard</a>
    </div>
  </body>
</html>
