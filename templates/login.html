<!doctype html>
<html>
  <head>
    <title>Login</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #36d1dc, #5b86e5);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        background: #ffffff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        width: 320px;
        text-align: center;
      }

      h2 {
        margin-bottom: 25px;
        color: #333;
      }

      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 14px;
        transition: 0.3s;
      }

      input:focus {
        border-color: #36d1dc;
        outline: none;
        box-shadow: 0 0 5px rgba(54, 209, 220, 0.5);
      }

      button {
        width: 100%;
        padding: 12px;
        background: #36d1dc;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
      }

      button:hover {
        background: #2bbac3;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Login</h2>

      <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" />
        <input type="password" name="password" placeholder="Password" />
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
